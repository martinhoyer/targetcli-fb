---
# Packit is used for upstream CI only: Copr builds and tmt tests of pull
# requests.
#
# The spec file is maintained in Fedora dist-git, together with the Packit
# jobs (pull_from_upstream, koji_build, bodhi_update) that bring new releases
# into Fedora: https://src.fedoraproject.org/rpms/targetcli
#
# See documentation: https://packit.dev/docs/configuration/

specfile_path: targetcli.spec
upstream_package_name: targetcli
downstream_package_name: targetcli
upstream_tag_template: v{version}

actions:
  post-upstream-clone:
    # Build with the spec file Fedora actually uses
    - curl -fsSLO https://src.fedoraproject.org/rpms/targetcli/raw/rawhide/f/targetcli.spec
  create-archive:
    - hatch build -t sdist
    - bash -c "ls -1t ./dist/*.tar.gz | head -n 1"

srpm_build_deps:
  - curl
  - hatch
  - python3-hatchling
  - python3-hatch-vcs

jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-all
      - epel-10

  - job: tests
    trigger: pull_request
    targets:
      - fedora-latest-stable
      - epel-10
